# Path-scoped so this only runs when ocr-service itself, or one of the two genuinely
# shared modules (common-library, protos), actually changed — see
# docs/architecture-deep-dive.md §4 for why those two are the only shared paths
# that need to appear here alongside the service's own.

ocr-service:build-test:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  script:
    - mvn $MAVEN_CLI_OPTS -pl ocr-service -am install
  artifacts:
    paths:
      - ocr-service/target/*.jar
    expire_in: 1 day
  rules:
    - changes:
        - ocr-service/**
        - common-library/**
        - protos/**
        - pom.xml

ocr-service:docker:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - job: ocr-service:build-test
      optional: true
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -f ocr-service/Dockerfile -t "$CI_REGISTRY_IMAGE/ocr-service:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/ocr-service:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ocr-service/**
        - common-library/**
        - protos/**
        - pom.xml

ocr-service:deploy-dev:
  stage: deploy
  image: alpine/helm:3.15.0
  needs:
    - job: ocr-service:docker
      optional: true
  environment:
    name: dev/ocr-service
  script:
    - helm upgrade --install ocr-service helm/ocr-service
        --namespace platform-dev --create-namespace
        --set image.repository="$CI_REGISTRY_IMAGE/ocr-service"
        --set image.tag="$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ocr-service/**
        - common-library/**
        - protos/**
        - pom.xml

ocr-service:deploy-prod:
  stage: deploy
  image: alpine/helm:3.15.0
  needs:
    - job: ocr-service:docker
      optional: true
  environment:
    name: prod/ocr-service
  when: manual
  script:
    - helm upgrade --install ocr-service helm/ocr-service
        --namespace platform-prod
        --set image.repository="$CI_REGISTRY_IMAGE/ocr-service"
        --set image.tag="$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ocr-service/**
        - common-library/**
        - protos/**
        - pom.xml
