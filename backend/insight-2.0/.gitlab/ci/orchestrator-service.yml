# Path-scoped so this only runs when orchestrator-service itself, or one of the two genuinely
# shared modules (common-library, protos), actually changed — see
# docs/architecture-deep-dive.md §4 for why those two are the only shared paths
# that need to appear here alongside the service's own.

orchestrator-service:build-test:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  script:
    - mvn $MAVEN_CLI_OPTS -pl orchestrator-service -am install
  artifacts:
    paths:
      - orchestrator-service/target/*.jar
    expire_in: 1 day
  rules:
    - changes:
        - orchestrator-service/**
        - common-library/**
        - protos/**
        - pom.xml

orchestrator-service:docker:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - job: orchestrator-service:build-test
      optional: true
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -f orchestrator-service/Dockerfile -t "$CI_REGISTRY_IMAGE/orchestrator-service:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/orchestrator-service:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - orchestrator-service/**
        - common-library/**
        - protos/**
        - pom.xml

orchestrator-service:deploy-dev:
  stage: deploy
  image: alpine/helm:3.15.0
  needs:
    - job: orchestrator-service:docker
      optional: true
  environment:
    name: dev/orchestrator-service
  script:
    - helm upgrade --install orchestrator-service helm/orchestrator-service
        --namespace platform-dev --create-namespace
        --set image.repository="$CI_REGISTRY_IMAGE/orchestrator-service"
        --set image.tag="$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - orchestrator-service/**
        - common-library/**
        - protos/**
        - pom.xml

orchestrator-service:deploy-prod:
  stage: deploy
  image: alpine/helm:3.15.0
  needs:
    - job: orchestrator-service:docker
      optional: true
  environment:
    name: prod/orchestrator-service
  when: manual
  script:
    - helm upgrade --install orchestrator-service helm/orchestrator-service
        --namespace platform-prod
        --set image.repository="$CI_REGISTRY_IMAGE/orchestrator-service"
        --set image.tag="$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - orchestrator-service/**
        - common-library/**
        - protos/**
        - pom.xml
