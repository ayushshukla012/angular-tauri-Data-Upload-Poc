server:
  port: 8083

grpc:
  server:
    port: 9096

spring:
  application:
    name: ocr-service
  datasource:
    url: jdbc:postgresql://localhost:5433/ocr
    username: ocr
    password: ocr
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
